directives:
  - add_model:
      file: package://test_models/wallflower/wallflower_flower.urdf
      name: robot
      default_joint_positions: {}
      default_free_body_pose: {}
  - add_weld:
      parent: world
      child: robot::base_link
      X_PC:
        translation: [0.0, 0.0, 0.0]
        rotation: !Rpy
          deg: [0.0, -0.0, 0.0]
  - add_model:
      file: package://test_models/wallflower/wallflower_wall_banana.urdf
      name: banana
      default_joint_positions: {}
      default_free_body_pose: {}
  - add_frame:
      name: A
      X_PF:
        base_frame: robot::ball
        translation: [0.0, 0.0, 0.0]
        rotation: !Rpy
          deg: [0.0, 0.0, 0.0]
  - add_weld:
      parent: world
      child: banana::banana
      X_PC:
        translation: [0.9, -0.1, 0.2]
        rotation: !Rpy
          deg: [0.0, -0.0, 0.0]
