directives:
  - add_model:
      file: package://iiwa_models/iiwa.urdf
      name: iiwa
      default_joint_positions: {}
      default_free_body_pose: {}
  - add_weld:
      parent: world
      child: iiwa::base_link
      X_PC:
        translation: [0.0, 0.0, 0.0]
        rotation: !Rpy
          deg: [0.0, -0.0, 0.0]
  - add_frame:
      name: calibrated_end_effector
      X_PF:
        base_frame: iiwa::iiwa_link_ee
        translation: [0.0, 0.0, 0.0]
        rotation: !Rpy
          deg: [0.0, 0.0, 0.0]
