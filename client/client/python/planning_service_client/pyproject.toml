[project]
name = "planning-service-client"
version = "0.0.1"
description = "Python client for the planning service"
readme = "README.md"
authors = [{ name = "David Bambrick", email = "david.bambrick@sony.com" }]
requires-python = ">=3.10,<3.14"
keywords = ["robotics", "shokunin", "planning", "planning_service"]
dependencies = [
  "click>=8.1.7",
  "grpcio>=1.69.0",
  "grpcio-tools>=1.69.0",
  "grpcio-health-checking>=1.69.0",
  "grpcio-status>=1.69.0",
  "numpy<2,>=1.24.4",
  "pytest>=8.2.1",
  "pyyaml>=5.3.1",
  "colorlog>=6.9.0",
  "planning-service-proto",
  "protobuf<6,>=5.29.5",
  "requests>=2.32.4",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.1.0", "ipykernel>=6.29.0"]


[tool.uv.sources]
planning-service-proto = { path = "../../../gen/python" }
bazel-build = { path = "../../../tools/python/bazel_build" }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
dependencies = ["bazel-build"]
